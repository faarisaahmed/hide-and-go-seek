{% extends "base.html" %}

{% block content %}
<main class="page page--center">
    <header class="hero">
        <h1 class="hero__title">Hide <span>and Go</span> Seek</h1>
        <p class="hero__tagline">
            One seeker counts to twenty. Everybody else has that long to
            find a wardrobe.
        </p>
    </header>

    <section class="card">
        <div class="card__header">
            <h2 class="card__title">Your name</h2>
        </div>
        <input id="displayName" class="field" placeholder="Who are you?"
               maxlength="16" autocomplete="off" autocapitalize="words"
               spellcheck="false">
    </section>

    <section class="card">
        <button id="createRoomButton" class="btn btn--primary btn--block">
            Create a room
        </button>

        <div class="divider">or join one</div>

        <div class="row">
            <input id="roomCodeInput" class="field field--code" placeholder="0000"
                   inputmode="numeric" maxlength="4" autocomplete="off">
            <button id="joinRoomButton" class="btn">Join</button>
        </div>
    </section>

    <p id="messageBox" class="notice"></p>
</main>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/home.js') }}"></script>
{% endblock %}
