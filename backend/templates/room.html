{% extends "base.html" %}

{% block title %}Lobby · Hide and Go Seek{% endblock %}

{% block content %}
<div class="container">
    <button id="homeButton" class="home-btn">Home</button>

    <h2 id="roomCodeDisplay">Room</h2>

    <div class="chat-container">
        <div class="chat-toggle">
            <span id="chatToggleIcon">▼</span>
        </div>

        <div id="chatPanel" class="chat-panel">
            <div id="chatBox" class="chat-box"></div>
            <input id="chatInput" placeholder="Type message...">
            <button id="sendChatButton">Send</button>
        </div>
    </div>

    <h3>Players</h3>
    <ul id="playerList"></ul>

    {# Shown by lobby.js only for the host. #}
    <button id="startButton" style="display:none;">Start Game</button>

    <div id="emojiPicker" class="emoji-box" style="display:none;"></div>
    <div id="messageBox"></div>

    <button id="refreshButton">Refresh Players</button>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script type="module" src="{{ url_for('static', filename='js/lobby.js') }}"></script>
{% endblock %}
