{% extends "base.html" %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">
{% endblock %}

{% block content %}
<canvas id="gameCanvas"></canvas>

{# Touch controls. Harmless on desktop, where keyboard input is used. #}
<div id="controls">
    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="buttons">
        <div id="btnX" class="btn">X</div>
        <div id="btnA" class="btn">A</div>
        <div id="btnB" class="btn">B</div>
        <div id="btnY" class="btn">Y</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script type="module" src="{{ url_for('static', filename='js/game/main.js') }}"></script>
{% endblock %}
